packages:
  - 'packages/*'
  - 'decks/*'

catalog:
  # Slidev ecosystem — pin to same major
  '@slidev/cli': ^52.11.3
  '@slidev/client': ^52.11.3
  '@slidev/types': ^52.11.3
  'slidev-theme-braincraft': 'workspace:*'
  'slidev-addon-braincraft': 'workspace:*'

  # Vue ecosystem
  vue: ^3.5.29

  # UnoCSS — match Slidev's version
  unocss: ^66.6.2
  '@unocss/reset': ^66.6.2

  # Code highlighting
  shiki: ^4.0.0

  # Development
  typescript: ^5.9.3
  '@antfu/eslint-config': ^4.12.0
  eslint: ^9.25.0
  prettier: ^3.5.3
  prettier-plugin-slidev: ^1.0.5
