minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - 'packages/*'
  - 'decks/*'

overrides:
  semver: ^7.8.5
  undici-types: ^6.28.1

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@iconify-json/carbon': ^1.2.26
  '@iconify-json/logos': ^1.2.13

  # Shiki transformers — code block annotations
  '@shikijs/transformers': ^4.0.0

  # Slidev ecosystem — pin to same major
  '@slidev/cli': ^52.19.1
  '@slidev/client': ^52.19.1
  '@slidev/types': ^52.19.1

  # Vite plugins
  '@vitejs/plugin-vue': ^6.0.8

  eslint: ^10.10.0
  eslint-plugin-format: ^2.0.1
  lint-staged: ^17.5.0
  playwright: ^1.52.0
  prettier: ^3.9.6
  prettier-plugin-slidev: ^1.0.5
  qrcode: ^1.5.4

  simple-git-hooks: ^2.14.0
  sirv: ^3.0.0
  slidev-addon-excalidraw: ^1.0.4
  slidev-workspace: ^0.9.3
  typescript: ^6.0.3
  unocss: ^66.10.0
  vite: ^8.2.2
  vitest: ^5.0.0
  vue: ^3.5.42
  vue-tsc: ^3.3.11
