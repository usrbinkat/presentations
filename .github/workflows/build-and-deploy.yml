name: Build and Deploy Presentations

on:
  push:
    branches: [main]
    paths:
      - 'decks/**'
      - 'packages/**'
      - 'shared/**'
      - 'www/**'
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-and-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            www/sites/presentations/pnpm-lock.yaml

      - name: Install Slidev workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Astro site dependencies
        run: pnpm -C www/sites/presentations install --frozen-lockfile

      - name: Lint and typecheck workspace
        run: |
          pnpm lint
          pnpm typecheck

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Lint
        run: pnpm lint

      - name: Typecheck Slidev workspace
        run: pnpm exec vue-tsc --noEmit

      - name: Build Astro site + all Slidev decks
        run: pnpm -C www/sites/presentations run build

      - name: Verify build output
        run: |
          DIST="www/sites/presentations/dist"
          if [ ! -f "$DIST/index.html" ]; then
            echo "::error::Astro landing page missing"
            exit 1
          fi
          for deck_dir in decks/*/; do
            deck=$(basename "$deck_dir")
            if [ ! -f "$DIST/$deck/index.html" ]; then
              echo "::error::Deck detail page missing for $deck"
              exit 1
            fi
            if [ ! -f "$DIST/$deck/slides/index.html" ]; then
              echo "::error::Slidev SPA missing for $deck"
              exit 1
            fi
            echo "✓ $deck: detail page + slides SPA"
          done

      - name: Export PDFs
        run: |
          DIST="www/sites/presentations/dist"
          for deck_dir in decks/*/; do
            deck=$(basename "$deck_dir")
            echo "::group::Exporting $deck PDF"
            pnpm -C "decks/$deck" exec slidev export slides.md \
              --output "../../$DIST/$deck/slides/$deck.pdf" \
              --timeout 60000
            echo "::endgroup::"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: www/sites/presentations/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
