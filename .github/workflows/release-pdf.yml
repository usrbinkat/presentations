name: Release PDF

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Extract deck name from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DECK="${TAG%-v*}"
          echo "deck=$DECK" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Export PDF
        run: |
          pnpm -C "decks/${{ steps.meta.outputs.deck }}" exec slidev export slides.md \
            --output "../../dist/${{ steps.meta.outputs.deck }}.pdf" \
            --timeout 60000

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.deck }} ${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            "dist/${{ steps.meta.outputs.deck }}.pdf"
