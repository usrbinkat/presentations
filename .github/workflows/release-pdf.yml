name: Release PDF

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Extract deck name from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DECK="${TAG%-v*}"
          echo "deck=$DECK" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Validate deck and export PDF
        env:
          DECK: ${{ steps.meta.outputs.deck }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ ! -d "decks/$DECK" ] || [ ! -f "decks/$DECK/slides.md" ]; then
            echo "::error::No deck at decks/$DECK/slides.md"
            exit 1
          fi
          mkdir -p dist
          pnpm -C "decks/$DECK" exec slidev export slides.md \
            --output "../../dist/$DECK.pdf" \
            --timeout 60000

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DECK: ${{ steps.meta.outputs.deck }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$DECK $TAG" \
            --generate-notes \
            "dist/$DECK.pdf"
